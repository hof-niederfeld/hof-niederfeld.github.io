hero: 
  title: "Nachhaltiger <span class='text-primary'>Miscanthus</span> aus der Region"
  subtitle: "Miscanthus ist pflegeleicht, vielseitig einsetzbar und eignet sich für Energie, Bodenverbesserung und Landwirtschaft."

features-vorteile:
  title: "Vorteile von Miscanthus"
  subtitle: "Miscanthus ist eine schnell wachsende, mehrjährige Pflanze mit ökologischen und praktischen Vorteilen."
  row-cols: "row-cols-1 row-cols-md-2 row-cols-lg-3"
  items:
    - title: "Hohe Wasseraufnahme"
      text: "Miscanthus kann viel Feuchtigkeit aufnehmen und unterstützt so auf natürliche Weise die Bodengesundheit"
      icon: "droplet"
    - title: "Natürliche Geruchsbindung"
      text: "Die Pflanze hilft, unangenehme Gerüche zu reduzieren und sorgt für ein angenehmeres Klima in Stall oder Lager."
      icon: "seedling"
    - title: "Unterstützt gesunde Böden"
      text: "Miscanthus trägt zu stabileren Böden bei und kann die Bildung von Schimmel oder Pilzen reduzieren."
      icon: "shield"
    - title: "Vielseitig einsetzbar"
      text: "Ob im Garten, Stall oder Haus. Miscanthus ist flexibel einsetzbar und ersetzt zuverlässig herkömmliche Materialien."
      icon: "gear"
    - title: "Nachhaltig und pflegeleicht"
      text: "Die mehrjährige Pflanze wächst ohne chemische Hilfsmittel, ist pflegeleicht und klimafreundlich."
      icon: "globe"

cards-varianten:
  id: "varianten"
  title: "Unsere Varianten"
  subtitle: "Entdecken Sie unsere Miscanthus-Sorten und ihre Eigenschaften."
  row-cols: "row-cols-1 row-cols-md-2"
  items:
    - title: "Feiner Miscanthus"
      text: "Besonders gut als Einstreu für Kleintiere geeignet, da er hygienisch ist und unangenehme Gerüche reduziert. Auch als Mulch im Garten oder Beet praktisch, weil er sich gleichmäßig verteilt, Feuchtigkeit speichert und den Boden schützt."
    - title: "Grober Miscanthus"
      text: "Optimal als Einstreu für größere Tiere, da er eine komfortable, gut belüftete Unterlage bietet. Außerdem eignet er sich als natürlicher Dämmstoff für Stall oder Lager und unterstützt ein angenehmes Raumklima."
  hint: "Wenn Sie unsicher sind, welche Miscanthus-Variante für Ihr Projekt am besten passt, helfen wir Ihnen gerne weiter und empfehlen die passende Lösung"

features-sizes:
  id: "sizes"
  title: "Verpackungsgrößen"
  subtitle: "Die richtige Verpackung für jeden Bedarf."
  row-cols: "row-cols-1 row-cols-md-2 row-cols-xl-4"
  items:
  - title: "Big Bag"
    text: "Praktisch für größere Mengen. Ideal für Landwirtschaft, Tierhaltung oder als Vorrat. Je nach Bedarf in verschiedenen Füllgrößen erhältlich."
    img_src: "assets/images/miscanthus/bigbag.png"
    img_alt: "Icon eines Big Bags"
  - title: "Brikett"
    text: "Kleine und handliche Form. Einfach zu transportieren und zu lagern. Eignet sich für kleine Anwendungen wie Kamin oder Ofen."
    icon: "cube"
  - title: "Sack"
    text: "Flexibel einsetzbar und leicht zu handhaben. Ideal für private Gärten, kleinere Tierbestände oder gelegentliche Nutzung."
    icon: "sack-xmark"
  - title: "Loose"
    text: "Individuell nach Bedarf entnehmbar. Die lose Ware kann flexibel und einfach genutzt werden, genau so viel wie Sie benötigen."
    icon: "leaf"
  hint: "Die verfügbaren Größen können variieren. Gerne empfehlen wir Ihnen die passende Variante für Ihren Bedarf."


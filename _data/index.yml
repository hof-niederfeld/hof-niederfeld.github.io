cards:
  id: "angebote"
  title: "Produkte und Leistungen"
  subtitle: "Regionale Produkte und vielseitige Leistungen vom Hof Niederfeld."
  height: "200px"
  row-cols: "row-cols-1 row-cols-md-2 row-cols-lg-4"
  items:
    - title: "Miscanthus"
      text: "Regional für Garten, Tierhaltung oder Energie angebaut. Vielseitig und nachhaltig."
      img_src: "assets/images/index/miscanthus.jpg"
      img_alt: "Ernte von Miscanthus"
      href: "/miscanthus/"
    - title: "Betonsteine"
      text: "In diversen Größen und Mustern erhältlich. Ideal für Gartenanlagen und Bauprojekte."
      img_src: "assets/images/index/betonsteine.jpg"
      img_alt: "Bauprojekt mit Betonsteinen"
      href: "/betonsteine/"
    - title: "Lebensmittel"
      text: "Frische Produkte vom Hof wie Nudeln, Eier und Honig. Direkt aus der Region für höchste Qualität."
      img_src: "assets/images/index/lebensmittel.jpg"
      img_alt: "Nudeln vom Hof Niederfeld"
      href: "/lebensmittel/"
    - title: "Lohnarbeit"
      text: "Unterstützung bei Pflanzung, Ernte, Mistentsorgung und Lieferung von Einstreu."
      img_src: "assets/images/index/lohnarbeit.jpg"
      img_alt: "Einsatz bei der Lohnarbeit"
      href: "/lohnarbeit/"


hero:
  title: "Effiziente <span class='text-primary'>Lohnarbeit</span> für deinen Hof"
  subtitle: "Praktische Unterstützung mit Erfahrung und moderner Technik."

cards:
  title: "Unsere Leistungen"
  subtitle: "Verschiedene Services, die deinen Alltag auf dem Hof erleichtern."
  row-cols: "row-cols-1 row-cols-lg-3"
  items:
    - title: "Pflanz- und Erntetechnik"
      text: "Wir unterstützen dich bei Pflanz- und Erntearbeiten auf deinem Hof. Mit passender Technik und unserer Erfahrung gestalten wir die Abläufe praktisch und einfach."
    - title: "Entsorgung von Mist"
      text: "Wir übernehmen die Abfuhr und Entsorgung von Mist und Gülle auf deinem Hof. Dabei achten wir darauf, dass alles geordnet und unkompliziert abläuft."
    - title: "Lieferung von Einstreu"
      text: "Wir liefern Einstreu direkt auf deinen Hof. Menge und Zeitpunkt stimmen wir nach deinen Bedürfnissen ab, damit deine Tiere einen sauberen und komfortablen Platz haben."
  hint: "Detaillierte Informationen zu Abläufen, Preisen und Terminen besprechen wir gerne persönlich. Melde dich einfach direkt bei uns."


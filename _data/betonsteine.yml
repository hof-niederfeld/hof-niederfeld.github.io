hero:
  title: "Robuste <span class='text-primary'>Betonsteine</span> für dein Projekt"
  subtitle: "Unsere Betonsteine sind eine ideale Lösung für kreative und langlebige Bauprojekte im Außenbereich."

features:
  title: "Vorteile unserer Betonsteine"
  subtitle: "Unsere Betonsteine sind stabil, vielseitig einsetzbar und wirken natürlich."
  row-cols: "row-cols-1 row-cols-md-2 row-cols-lg-3"
  items:
    - title: "Hohe Belastbarkeit"
      text: "Unsere Steine eignen sich für Garten, Landschaft oder als Sitzgelegenheit und halten viel aus."
      icon: "cubes"
    - title: "Modular erweiterbar"
      text: "Die Steine lassen sich einfach kombinieren, zum Beispiel für Beeteinfassungen, Mauern oder Bänke."
      icon: "puzzle-piece"
    - title: "Langlebig & nachhaltig"
      text: "Hergestellt aus robustem Material für eine lange Nutzung ohne viel Pflege."
      icon: "recycle"

cards:
  id: "varianten"
  title: "Formvarianten"
  subtitle: "Wählen Sie aus vier Formen für maximale Gestaltungsfreiheit."
  row-cols: "row-cols-1 row-cols-md-2 row-cols-xl-4"
  items:
    - title: "Klassisch"
      text: "Vielseitig einsetzbar für Mauern, Wege oder Terrassen. Lässt sich leicht verlegen und passt zu vielen Projekten."
      img_src: "assets/images/betonsteine/variante_classic.jpg"
      img_alt: "Klassischer rechteckiger Betonstein auf einer Steinfläche"
    - title: "Radien-Stein"
      text: "Mit abgerundeten Ecken für sanfte Übergänge und runde Formen. Gut geeignet für geschwungene Wege, Kreisflächen oder dekorative Gartenbereiche."
      img_src: "assets/images/betonsteine/variante_radien.jpg"
      img_alt: "Betonsteine mit abgerundeten Ecken in Kreisform verlegt"
    - title: "Bankelemente"
      text: "Modulare Sitzflächen, flexibel für Ecken und Kanten. Ideal für Terrassen, Plätze oder Gartenbereiche, die dekorativ und praktisch sein sollen."
      img_src: "assets/images/betonsteine/variante_bank.jpg"
      img_alt: "Modulare Betonelemente als Sitzbank auf einem Platz"
    - title: "Abschlussstein"
      text: "Zum Abdecken von Mauerkanten oder als dekorativer Abschluss für Beete und Wände. Sorgt für ein sauberes und fertiges Erscheinungsbild."
      img_src: "assets/images/betonsteine/variante_abschluss.jpg"
      img_alt: "Dekorativer Abschlussstein als Abschluss einer Mauer"
  hint: "Unsere Betonsteine gibt es in Schritten von 40cm. Die kleinste Variante misst 40&nbsp;&times;&nbsp;40&nbsp;&times;&nbsp;40cm, die größte 160&nbsp;&times;&nbsp;80&nbsp;&times;&nbsp;80cm. Preise teilen wir Ihnen gerne per E-Mail mit. Einige Steine sind sofort verfügbar, andere fertigen wir innerhalb weniger Tage nach Wunsch."

text_image_betonplatten:
  title: "Unsere Betonplatten"
  subtitle: "Robuste Flächen für Garten, Terrasse und Hof."
  text: "Unsere Betonplatten sind in großen Formaten erhältlich und bieten eine stabile Grundlage für unterschiedliche Bauprojekte. Durch ihre klare Form und solide Ausführung eignen sie sich für Wege, Terrassen oder Hofbereiche.<br><br><b>Maße:</b> 200&times;200&times;16 cm oder 200&times;100&times;16 cm"
  img_src: "assets/images/betonsteine/bodenplatten.jpg"
  img_alt: "Bodenplatten aus Beton"
  img_col: 6

text_image_muster:
  title: "Oberflächen und Muster"
  subtitle: "Gestalte deine Betonsteine ganz nach deinem Stil."
  text: "Unsere Betonsteine gibt es entweder schlicht oder mit unterschiedlichen Oberflächenstrukturen. So lassen sie sich gut an jedes Bauprojekt anpassen. Die Abbildungen zeigen die verfügbaren Varianten im Vergleich."
  img_src: "assets/images/betonsteine/muster.png"
  img_alt: "Diverse Muster der Betonsteine"
  img_col: 7
  reverse: true
  contain: true

gallery:
  title: "Einblicke in unsere Projekte"
  subtitle: "So haben unsere Betonsteine in Gärten und auf Terrassen Verwendung gefunden."
  items:

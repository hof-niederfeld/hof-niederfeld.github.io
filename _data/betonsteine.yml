      img_alt: "Betonsteine mit darauf platzierten Bankelementen im Garten"
    - img_src: "assets/images/betonsteine/mauer2.jpg"
      img_alt: "Mauer aus Betonsteinen"
    - img_src: "assets/images/betonsteine/fancy-muster.jpg"
      img_alt: "Betonstein mit besonderer Musterung"
    - img_src: "assets/images/betonsteine/mauer3.jpg"
      img_alt: "Mauer aus Betonsteinen im Garten vor einem Haus"
    - img_src: "assets/images/betonsteine/eck-bank.jpg"
      img_alt: "Beispiel für eine Bank aus Betonsteinen"

cta:
  title: "Betonsteine für dein Projekt gesucht?"

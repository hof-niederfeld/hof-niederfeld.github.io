{% assign content = include.content %}

<div class="cu-section" id="{{ content.id }}">
    <div class="container">
        <div class="row">
            <div class="col">
                <h2 class="cu-section-title">{{ content.title}}</h2>
                <p class="cu-section-subtitle">{{ content.subtitle}}</p>
            </div>
        </div>
        <div class="row {{ content.row-cols }} g-3">
            {% for item in content.items %}
            <div class="col">
                <div class="card h-100">
                    {% if item.img_src != nil %}
                    <img src="{{ item.img_src | relative_url }}" alt="{{ item.img_alt }}" class="card-img-top object-fit-cover" height="{{ content.height | default: "350px" }}">
                    {% endif %}
                    <div class="card-body d-flex flex-column justify-content-between align-items-start">
                        <div>
                            <h3 class="card-title h5">{{ item.title }}</h3>
                            <p class="card-text">{{ item.text }}</p>
                        </div>
                        {% if item.href %}
                            <a href="{{ item.href }}" class="btn btn-primary mt-3">Mehr erfahren</a>
                        {% endif %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <div class="row">
            <div class="col">
                <p class="text-muted mt-3 mb-0">{{ content.hint }}</p>
            </div>
        </div>
    </div>
</div>
